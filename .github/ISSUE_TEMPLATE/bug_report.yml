name: Bug report
description: Report a reproducible AGENTS.md Compactor problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AGENTS.md Compactor.

        **Do not paste private, proprietary, credential-bearing, or otherwise sensitive AGENTS.md content into a public GitHub issue.**

  - type: textarea
    id: bug_description
    attributes:
      label: Bug description
      description: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version_commit
    attributes:
      label: Compactor version or commit
      description: Provide the version or commit SHA if known.

  - type: input
    id: operating_system
    attributes:
      label: Operating system
      placeholder: macOS 15.6
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js version
      description: Paste the output of `node --version` if available.

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Safari 18.6
    validations:
      required: true

  - type: dropdown
    id: selected_mode
    attributes:
      label: Selected mode
      options:
        - Conservative
        - Balanced
        - Aggressive
        - Unknown or not applicable
    validations:
      required: true

  - type: dropdown
    id: demonstrated_sample
    attributes:
      label: Does the demonstrated sample reproduce the issue?
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction steps
      description: Use the demonstrated sample or a sanitized minimal example. Do not share private AGENTS.md content.
      placeholder: |
        1. Start the local UI.
        2. Select a mode.
        3. Describe the next action and observed result.
    validations:
      required: true

  - type: checkboxes
    id: sensitive_content
    attributes:
      label: Sensitive-content confirmation
      options:
        - label: I confirm that this issue does not include private, proprietary, credential-bearing, or otherwise sensitive AGENTS.md content.
          required: true
